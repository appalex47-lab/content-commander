<!doctype html><html lang="es"><meta charset="utf-8"><title>IndexedDB functional smoke</title><body><pre id="result">RUNNING</pre><script src="../src/storage.js"></script><script>
(async()=>{const out=[];const check=(name,ok,detail="")=>out.push(`${ok?"PASS":"FAIL"} — ${name}${detail?": "+detail:""}`);try{
 const init=await AppStorage.init();check("init IndexedDB",!!init.data && !init.warning,init.warning||"");
 const data={company:{company:"Prueba",offer:"Servicio"},profileSaved:true,learning:{quizPassed:true}};
 const saved=await AppStorage.write(data);check("write record",saved.ok,saved.error||"");
 const read=await AppStorage.read();check("read after write",read.data.company.company==="Prueba"&&read.data.learning.quizPassed===true);
 const json=await AppStorage.createBackup();const parsed=JSON.parse(json);check("backup envelope",parsed.app==="Content Commander"&&parsed.backupVersion===1&&!!parsed.exportedAt);
 const checked=AppStorage.validateBackup(json);check("valid backup accepted",checked.ok&&checked.preview.sectionCount===3);
 const invalid=AppStorage.validateBackup("{broken");check("malformed JSON rejected",!invalid.ok);
 const wrong=AppStorage.validateBackup({app:"Other",backupVersion:1,data:{x:1}});check("wrong app rejected",!wrong.ok);
 const imported=await AppStorage.importBackup({app:"Content Commander",backupVersion:1,data:{company:{company:"Importada"},apiKey:"secret",other:1}},"replace");
 const after=await AppStorage.read();check("replace import writes",imported.ok&&after.data.company.company==="Importada");check("API key omitted on import",!Object.prototype.hasOwnProperty.call(after.data,"apiKey"));
 const merged=await AppStorage.importBackup({app:"Content Commander",backupVersion:1,data:{strategy:{goal:"Tráfico"}}},"merge");const finalState=await AppStorage.read();check("merge preserves existing sections",merged.ok&&finalState.data.company.company==="Importada"&&finalState.data.strategy.goal==="Tráfico");
 }catch(e){check("unexpected exception",false,e&&e.message||String(e));}document.querySelector("#result").textContent=out.join("\n")+`\n\n${out.filter(x=>x.startsWith("PASS")).length}/${out.length} functional checks passed.`;document.body.dataset.done="true";})();
</script></body></html>
